<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#246fc5" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before the first paint, including when storage is blocked.
      (() => {
        let preference = 'system';
        try {
          preference = localStorage.getItem('pockethernet.theme') || 'system';
        } catch {}
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').content = '#141e2c';
        }
      })();
    </script>
    <meta
      name="description"
      content="Control and run tests with a Pockethernet network analyzer."
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <title>Pocketweb for Pockethernet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
