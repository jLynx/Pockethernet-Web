name = "pockethernet-web"
main = "src/worker.ts"
compatibility_date = "2026-09-15"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/assets/index-*.js",
  "/assets/index-*.css",
  "/assets/logo-*.png",
  "/pockethernet-192.png",
  "/pockethernet-512.png",
]
